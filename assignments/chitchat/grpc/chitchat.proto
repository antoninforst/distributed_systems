
syntax = "proto3";

package chitchat;

option go_package = "chit-chat/grpc;chatpb";

message JoinRequest {
  string display_name = 1;
}

message LeaveRequest {
  string client_id = 1;
}

message LeaveReply {}

message PublishRequest {
  string client_id = 1;
  string content = 2;
}

message PublishReply {}

message ChatEvent {
  string content = 1;
  uint64 logical_time = 2;
  string client_id = 3;
}

service ChitChatService {
  rpc Join(JoinRequest) returns (stream ChatEvent);
  rpc Publish(PublishRequest) returns (PublishReply);
  rpc Leave(LeaveRequest) returns (LeaveReply);
}
